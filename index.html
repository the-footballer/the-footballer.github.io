function tourPage(){const T=TOUR,top=`<h2 style="font-size:40px;margin-bottom:6px">🏆 ${L("Tournament")}</h2><p class="sl" style="margin-top:0">${L("A knockout with every fan, one round a day.")}</p><details class="panel trules" open><summary>📋 ${L("How points work")}</summary><ul><li>${L("Each day is one round. It ends at midnight (Portugal time).")}</li><li>${L("Your points = your best score in each Arcade game today, added up.")}</li><li>${L("Playing the same game again only adds points if you beat your best in it today, so play lots of different games.")}</li><li>${L("Predictions don't count. Who Am I? does.")}</li><li>${L("Most points at midnight goes through. A draw is decided at random.")}</li></ul></details>`;

document.querySelectorAll(".adminnav").forEach(b=>b.hidden=!ADMIN);const a=$("#announce");if(a){a.textContent=SITE.announcement?"📣 "+SITE.announcement:"";a.hidden=!SITE.announcement||!me}}
async function checkAdmin(){ADMIN=false;ADMIN_IDS=new Set();if(SB&&me){try{const[a,ids]=await Promise.all([SB.rpc("is_admin"),SB.rpc("admin_ids")]);ADMIN=a.data===true;(ids.data||[]).forEach(x=>ADMIN_IDS.add(typeof x==="string"?x:Object.values(x)[0]))}catch(e){}}
applySite();if(tab==="chat")drawThread(true);if(tab==="admin"||tab==="account")render()}
const restrictText=r=>r.status==="banned"?"You are banned from chat.":r.status==="banned_all"?"Your account is banned.":r.status==="suspended"?`Your account is suspended until ${new Date(r.until).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}.`:`You are muted in chat until ${hm(r.until)}.`;
async function loadSafety(){if(!(SB&&me))return;try{const[r,b,w]=await Promise.all([SB.from("user_restrictions").select("status,until,reason").maybeSingle(),SB.from("blocks").select("blocked_id"),SB.from("user_warnings").select("id,message,created_at").is("seen_at",null).order("created_at")]);
const x=r.data;MYR=x&&(x.status==="banned"||x.status==="banned_all"||new Date(x.until)>Date.now())?x:null;BLOCKED=new Set((b.data||[]).map(y=>y.blocked_id));WARN=w.data||[];
if(MYR&&(MYR.status==="banned_all"||MYR.status==="suspended")){LOGIN_NOTE=restrictText(MYR)+(MYR.reason?" Reason: "+MYR.reason:"");stopInbox();me=null;saved=[];SB.auth.signOut();render();return}
showWarning();if(tab==="chat")render()}catch(e){}}
function showWarning(){const box=$("#warnbox");if(!box)return;const w=WARN[0];box.hidden=!w;if(w)box.innerHTML=`<div class="warncard" role="alertdialog" aria-labelledby="warnh"><h3 id="warnh">⚠️ A message from The Footballer admins</h3><p>${esc(w.message)}</p><small class="sl">${new Date(w.created_at).toLocaleString("en-GB")}</small><button class="btn" data-ackw="${w.id}">I understand</button></div>`}
const isMuted=u=>!!(me&&(me.muted||[]).includes(u));
function msgMenu(m){if(REPFOR===m.i)return`<div class="mmenu"><small>Why are you reporting this?</small>${[["abuse","Abuse"],["harassment","Bullying"],["hate","Hate"],["threat","Threat"],["spam","Spam"],["personal_info","Personal info"],["other","Other"]].map(([k,l])=>`<button class="chip" data-rep="${m.i}|${k}">${l}</button>`).join("")}<button class="back" data-mact="${m.i}">Cancel</button></div>`;
return`<div class="mmenu"><button class="chip" data-repopen="${m.i}">🚩 Report</button><button class="chip" data-mute="${esc(m.u)}">${isMuted(m.u)?"🔊 Unmute":"🔇 Mute"}</button><button class="chip" data-block="${esc(m.u)}">${BLOCKED.has(m.u)?"✅ Unblock":"⛔ Block"}</button></div>`}
function drawThread(keep){const el=$("#thread");if(!el)return;const top=el.scrollTop,mine=m=>me&&(m.u?m.u===me.id:m.n===me.name);
el.innerHTML=THREAD.length?THREAD.map(m=>{const own=mine(m);if(!own&&m.u&&(BLOCKED.has(m.u)||isMuted(m.u)))return`<div class="bub hid"><small>${BLOCKED.has(m.u)?"Blocked":"Muted"} user · ${msgTime(m.t)} <button class="mact" data-mact="${m.i}" aria-label="Message options">⋯</button></small><i>Message hidden</i>${MACT===m.i?msgMenu(m):""}</div>`;
const badge=m.u&&ADMIN_IDS.has(m.u)?' <span class="adminbadge">ADMIN</span>':"",act=!own&&SB&&m.i&&m.u?` <button class="mact" data-mact="${m.i}" aria-label="Message options" aria-expanded="${MACT===m.i}">⋯</button>`:"";
return`<div class="bub ${own?"me":""}"><small>${esc(m.n)}${badge} · ${msgTime(m.t)}${chatAddBtn(m)}${act}</small>${m.rm?'<i class="removed">🚫 This message was removed by a moderator</i>':(newsBubble(m.b)||esc(m.b))}${MACT===m.i?msgMenu(m):""}</div>`}).join(""):'<p class="empty" style="padding:10px">No messages yet. Say hello!</p>';
el.scrollTop=keep?top:el.scrollHeight}
async function reportMsg(id,reason){const{data,error}=await SB.rpc("report_message",{p_message_id:+id,p_reason:reason});toast(error?"Couldn't send the report. Try again.":data&&data.ok?(data.already?"You already reported this message":"Thanks. The admins will review it."):(data&&data.error)||"Couldn't send the report.");MACT=REPFOR=null;drawThread(true)}
async function toggleMute(u){const m=me.muted||[];me.muted=m.includes(u)?m.filter(x=>x!==u):[...m,u];SB.auth.updateUser({data:{muted:me.muted}});toast(me.muted.includes(u)?"Muted. You won't see their messages.":"Unmuted");MACT=null;drawThread(true)}
async function toggleBlock(u){const on=BLOCKED.has(u);const{error}=on?await SB.from("blocks").delete().eq("user_id",me.id).eq("blocked_id",u):await SB.from("blocks").insert({user_id:me.id,blocked_id:u});
if(error&&!/duplicate/i.test(error.message)){toast("Couldn't do that. Try again.");return}on?BLOCKED.delete(u):BLOCKED.add(u);toast(on?"Unblocked":"Blocked. They can't message you privately and their messages are hidden.");MACT=null;drawThread(true)}

const AV=(id,d)=>AINPUT[id]!=null?AINPUT[id]:d;
async function arpc(fn,args){const{data,error}=await SB.rpc(fn,args||{});if(error)throw new Error(/not authori[sz]ed/i.test(error.message)||error.code==="42501"?"You're not authorised to do that.":/does not exist|schema cache/i.test(error.message)?"Moderation isn't set up in Supabase yet (run supabase-moderation.sql).":error.message);return data}
async function aLoad(sec){AD[sec]=null;try{let d;if(sec==="overview")d=await arpc("admin_overview");else if(sec==="reports")d=await arpc("admin_reports",{p_status:repFilter});else if(sec==="chat")d=await arpc("admin_recent_all",{p_limit:120});
else if(sec==="users")d=await arpc("admin_search_users",{p_query:aQ});else if(sec==="safety")d=await arpc("admin_get_settings");else if(sec==="site"){const r=await SB.from("site_config").select("*").eq("id",1).maybeSingle();if(r.error)throw new Error(r.error.message);d=r.data||SITE}
else if(sec==="audit")d=await arpc("admin_audit",{p_limit:150});else if(sec==="admins")d=await arpc("admin_list_admins");AD[sec]=d}catch(e){AD[sec]={err:e.message}}if(tab==="admin")render()}

try{if(kind==="remove"){await arpc("admin_remove_message",{p_message_id:+rest[0],p_reason:v("ar-"+rest[0])||"Breaks the chat rules"});toast("Message deleted");AD.reports=AD.chat=undefined}
else if(kind==="resolve"||kind==="dismiss"){await arpc("admin_resolve_report",{p_id:+rest[0],p_status:kind==="resolve"?"resolved":"dismissed",p_decision:v("ad-"+rest[0])});toast(kind==="resolve"?"Report resolved":"Report dismissed");AD.reports=undefined}
else if(kind==="restrict"){const[u,act,min]=rest,res=await arpc("admin_set_restriction",{p_user:u,p_action:act,p_minutes:min?+min:null,p_reason:v("ur-"+u)});toast(res==="login_not_blocked"?"Done. Note: Supabase didn't block their login, but the chat ban still applies.":"Done");AD.users=undefined}
else if(kind==="warn"){await arpc("admin_warn",{p_user:rest[0],p_message:v("ur-"+rest[0])});toast("Warning sent");AD.users=undefined}
else if(kind==="coins"){const n=parseInt(v("uc-"+rest[0]),10);if(!n)throw new Error("Type how many coins to add (or remove with a minus, e.g. -100)");const bal=await arpc("admin_adjust_coins",{p_user:rest[0],p_delta:n,p_reason:v("ur-"+rest[0])});toast("New balance: 🪙 "+bal)}
else if(kind==="reset"){await arpc("admin_reset_scores",{p_user:rest[0],p_reason:v("ur-"+rest[0])});toast("Arcade scores reset");AD.users=undefined}
else if(kind==="safety"){const s=AD.safety||{},num=(id,d)=>parseInt(AV(id,d),10);await arpc("admin_update_settings",{p:{blocked_terms:AINPUT["as-blocked"]!=null?lines("as-blocked"):s.blocked_terms,threat_terms:AINPUT["as-threat"]!=null?lines("as-threat"):s.threat_terms,review_terms:AINPUT["as-review"]!=null?lines("as-review"):s.review_terms,
max_per_minute:num("as-mpm",s.max_per_minute),min_gap_seconds:num("as-gap",s.min_gap_seconds),max_links:num("as-links",s.max_links),strikes_for_timeout:num("as-strikes",s.strikes_for_timeout),timeout_minutes:num("as-tmin",s.timeout_minutes),block_personal_info:AINPUT["as-pii"]!=null?AINPUT["as-pii"]:s.block_personal_info}});toast("Safety settings saved");["as-blocked","as-threat","as-review"].forEach(k=>delete AINPUT[k]);AD.safety=undefined}
else if(kind==="site"){const s=AD.site||SITE,f={};Object.keys(FEATS).forEach(k=>f[k]=AINPUT["af-"+k]!=null?AINPUT["af-"+k]:(s.features||{})[k]!==false);await arpc("admin_update_site",{p:{features:f,announcement:AV("as-ann",s.announcement||""),hidden_news:AINPUT["as-hidden"]!=null?lines("as-hidden"):(s.hidden_news||[])}});toast("Site settings saved");delete AINPUT["as-hidden"];AD.site=undefined;loadSite()}
else if(kind==="hide"){const url=rest.join(":"),s=SITE;await arpc("admin_update_site",{p:{features:s.features,announcement:s.announcement||"",hidden_news:[...new Set([...(s.hidden_news||[]),url])]}});toast("Story hidden for everyone");open=null;tab="news";await loadSite()}
aMsg="";AD.overview=undefined}catch(e){aMsg="⚠️ "+e.message}render()}
